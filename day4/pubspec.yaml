name: day1
description: "Yuvi Labs Flutter UI Assignment - Day 1"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # SVG icons
  flutter_svg: ^2.2.1

  # Google Fonts
  google_fonts: ^6.3.2

  # Lucide Icons
  lucide_flutter: ^1.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/avatars/